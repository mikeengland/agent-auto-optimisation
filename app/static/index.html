<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grindstone Data Assistant</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #1f1b16; --muted: #6b645c; --border: #e4ded6;
    --accent: #7a4a24; --accent-text: #ffffff; --good: #2f7d4f; --bad: #b3401f; --chip: #efe9e2; --code: #f3efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171411; --card: #211d19; --text: #eee8e1; --muted: #a39a90; --border: #3a332c;
      --accent: #d09562; --accent-text: #1a120b; --good: #6cc592; --bad: #f08a6a; --chip: #2c2621; --code: #1b1815;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 4px 0 24px; color: var(--muted); }
  form.ask { display: flex; gap: 8px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 72px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; background: var(--accent); color: var(--accent-text); white-space: nowrap; }
  button.ghost { background: var(--chip); color: var(--text); }
  button:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 24px; }
  .chip { background: var(--chip); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: .875rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .q { color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  .answer { font-size: 1.1rem; margin: 0 0 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .8rem; color: var(--muted); }
  .meta span { background: var(--chip); border-radius: 6px; padding: 2px 8px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: .8rem; white-space: pre-wrap; }
  .fb { display: flex; align-items: center; gap: 8px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .fb .label { color: var(--muted); font-size: .9rem; margin-right: auto; }
  .fb button { padding: 6px 12px; }
  .fb-form { margin-top: 12px; display: grid; gap: 8px; }
  .fb-form label { font-size: .85rem; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 160px; gap: 8px; }
  .notice { margin-top: 12px; font-size: .9rem; padding: 10px 12px; border-radius: 8px; background: var(--chip); }
  .notice.good { color: var(--good); } .notice.bad { color: var(--bad); }
  a { color: var(--accent); }
  @media (max-width: 560px) { form.ask { flex-direction: column; } .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>☕ Grindstone Data Assistant</h1>
    <p>Ask a question about orders, customers, products or revenue. Tell us when an answer is wrong: your feedback becomes a test the assistant has to pass.</p>
  </header>

  <form class="ask" id="ask-form">
    <input id="question" placeholder="e.g. What was our revenue in May 2026?" autocomplete="off" required>
    <button id="ask-btn" type="submit">Ask</button>
  </form>
  <div class="chips" id="chips"></div>

  <div id="results"></div>
</main>

<template id="result-tpl">
  <div class="card">
    <div class="q"></div>
    <p class="answer"></p>
    <div class="meta"></div>
    <details><summary>How the assistant worked it out</summary><div class="trace"></div></details>
    <div class="fb">
      <span class="label">Was this right?</span>
      <button class="ghost up" type="button">👍</button>
      <button class="ghost down" type="button">👎</button>
    </div>
    <form class="fb-form" hidden>
      <label>What was wrong? <textarea name="what_was_wrong" required placeholder="Tell us what the assistant got wrong, and why."></textarea></label>
      <div class="row">
        <label>What should the answer have been? <input name="expected_answer" placeholder="e.g. £1,234.50"></label>
        <label>Correct number (optional) <input name="expected_value" type="number" step="any" placeholder="1234.5"></label>
      </div>
      <div><button type="submit">Send feedback</button></div>
    </form>
    <div class="notice" hidden></div>
  </div>
</template>

<script>
const EXAMPLES = [
  "What was our revenue in May 2026?",
  "How many orders did we receive in Q1?",
  "How many customers do we have?",
  "Which product sold the most units in June 2026?",
  "How many orders did we get last month?",
];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

for (const q of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.onclick = () => { $("#question").value = q; $("#ask-form").requestSubmit(); };
  $("#chips").append(b);
}

$("#ask-form").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("#question").value.trim();
  if (!question) return;
  const btn = $("#ask-btn");
  btn.disabled = true; btn.textContent = "Thinking…";
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (!res.ok) throw new Error(await res.text());
    render(await res.json());
  } catch (err) {
    alert("Something went wrong: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Ask";
  }
});

function render(run) {
  const el = $("#result-tpl").content.firstElementChild.cloneNode(true);
  $(".q", el).textContent = run.question;
  $(".answer", el).textContent = run.output.answer;
  $(".meta", el).innerHTML =
    (run.output.value !== null ? `<span>value: ${esc(run.output.value)}</span>` : "") +
    `<span>status: ${esc(run.output.status)}</span><span>model: ${esc(run.model)}</span><span>commit: ${esc(run.app_commit)}</span>`;
  $(".trace", el).innerHTML = run.steps.length
    ? run.steps.map(s => `<pre>${esc(s.args.query ?? JSON.stringify(s.args))}</pre><pre>${esc(s.result)}</pre>`).join("")
    : "<p>No tool calls.</p>";

  const notice = $(".notice", el), form = $(".fb-form", el);
  const show = (html, cls) => { notice.hidden = false; notice.className = "notice " + (cls || ""); notice.innerHTML = html; };
  $(".up", el).onclick = () => { form.hidden = true; show("Thanks! Glad that was useful.", "good"); };
  $(".down", el).onclick = () => { form.hidden = false; notice.hidden = true; $("textarea", form).focus(); };

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const body = {
      run_id: run.id,
      what_was_wrong: data.what_was_wrong,
      expected_answer: data.expected_answer || null,
      expected_value: data.expected_value === "" ? null : Number(data.expected_value),
    };
    const submit = $("button", form); submit.disabled = true;
    try {
      const res = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(await res.text());
      const out = await res.json();
      form.hidden = true;
      show(out.dry_run
        ? `Feedback saved to <code>${esc(out.path)}</code> (GitHub isn't configured, so no issue was created).`
        : `Thanks! Created <a href="${esc(out.url)}" target="_blank" rel="noopener">issue #${out.number}</a>. A coding agent will turn it into an eval and propose a fix.`, "good");
    } catch (err) {
      show("Couldn't send feedback: " + esc(err.message), "bad");
      submit.disabled = false;
    }
  });

  $("#results").prepend(el);
}
</script>
</body>
</html>
