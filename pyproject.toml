[project]
name = "agent-auto-optimisation"
version = "0.1.0"
description = "Example: turning human feedback on an agent into evals, then letting a coding agent optimise the agent against them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.52",
    "pydantic-evals>=2.52",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
