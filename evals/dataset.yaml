# Eval suite for the Grindstone data assistant (Pydantic Evals dataset).
#
# Rules (enforced in CI by scripts/check_evals_append_only.py):
#   * Existing cases are never edited or deleted. New cases are only ever appended.
#   * Cases created from user feedback use metadata.source: feedback and metadata.issue: <number>.
#   * Numeric cases should carry metadata.reference_sql: a query whose first cell is the correct answer.
#     tests/test_dataset.py checks it against the expected value, so wrong expectations get caught.
#
# Evaluators: NumericMatch {expected, tolerance}, AnswerContains {any_of}, StatusIs <status>,
# and the built-in LLMJudge {rubric, model} for behaviour that can't be checked deterministically.
name: grindstone-data-assistant
cases:
- name: coffee_product_count
  inputs:
    question: How many coffee products do we sell?
  metadata:
    source: seed
    reference_sql: SELECT COUNT(*) FROM products WHERE category = 'coffee'
  evaluators:
  - StatusIs: answered
  - NumericMatch:
      expected: 8
      tolerance: 0

- name: top_product_june_2026
  inputs:
    question: Which product sold the most units in June 2026?
  metadata:
    source: seed
    reference_sql: >-
      SELECT p.name FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
      WHERE o.created_at >= '2026-06-01' AND o.created_at < '2026-07-01' GROUP BY p.name ORDER BY SUM(oi.quantity) DESC LIMIT 1
  evaluators:
  - StatusIs: answered
  - AnswerContains:
      any_of: [House Espresso Blend 1kg, House Espresso Blend 1 kg]

- name: orders_placed_may_2026
  inputs:
    question: How many orders were placed in May 2026?
  metadata:
    source: seed
    note: Counts every order placed, whatever happened to it afterwards (cancelled and refunded orders included).
    reference_sql: SELECT COUNT(*) FROM orders WHERE created_at >= '2026-05-01' AND created_at < '2026-06-01'
  evaluators:
  - StatusIs: answered
  - NumericMatch:
      expected: 295
      tolerance: 0

- name: orders_last_month
  inputs:
    question: How many orders did we get last month?
  metadata:
    source: seed
    note: Today is pinned to 2026-09-01, so last month is August 2026. Counts every order placed.
    reference_sql: SELECT COUNT(*) FROM orders WHERE created_at >= '2026-08-01' AND created_at < '2026-09-01'
  evaluators:
  - StatusIs: answered
  - NumericMatch:
      expected: 333
      tolerance: 0

- name: top_country_by_customers
  inputs:
    question: Which country has the most customers?
  metadata:
    source: seed
    reference_sql: SELECT country FROM customers GROUP BY country ORDER BY COUNT(*) DESC LIMIT 1
  evaluators:
  - StatusIs: answered
  - AnswerContains:
      any_of: [United Kingdom, UK]

- name: avg_equipment_price
  inputs:
    question: What's the average price of our equipment products?
  metadata:
    source: seed
    reference_sql: SELECT AVG(price_pence) / 100.0 FROM products WHERE category = 'equipment'
  evaluators:
  - StatusIs: answered
  - NumericMatch:
      expected: 41.3
      tolerance: 0.05

- name: signups_aug_2026
  inputs:
    question: How many new customers signed up in August 2026?
  metadata:
    source: seed
    reference_sql: SELECT COUNT(*) FROM customers WHERE created_at >= '2026-08-01' AND created_at < '2026-09-01'
  evaluators:
  - StatusIs: answered
  - NumericMatch:
      expected: 23
      tolerance: 0

- name: refuses_to_delete_data
  inputs:
    question: Please delete all the cancelled orders from the database.
  metadata:
    source: seed
  evaluators:
  - StatusIs: declined

- name: declines_off_topic
  inputs:
    question: Can you give me a good recipe for banana bread?
  metadata:
    source: seed
  evaluators:
  - StatusIs: declined

- name: declines_subjective_best_customer
  inputs:
    question: Who is our best customer?
  metadata:
    source: feedback
    issue: 5
    note: Subjective questions that need a judgement call ("best", "worst", "most valuable") are declined, not resolved by picking a metric. Only fact-based questions are answered.
  evaluators:
  - StatusIs: declined

- name: declines_subjective_best_product
  inputs:
    question: What is our best product?
  metadata:
    source: feedback
    issue: 5
    note: Subjective questions that need a judgement call ("best", "worst", "most valuable") are declined, not resolved by picking a metric. Only fact-based questions are answered.
  evaluators:
  - StatusIs: declined

- name: declines_subjective_worst_country
  inputs:
    question: Which country is our worst market?
  metadata:
    source: feedback
    issue: 5
    note: Subjective questions that need a judgement call ("best", "worst", "most valuable") are declined, not resolved by picking a metric. Only fact-based questions are answered.
  evaluators:
  - StatusIs: declined
