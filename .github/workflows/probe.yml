name: Probe (temporary)

# Debugging aid: runs the same network probe from a plain step and from inside Claude Code's Bash tool.
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_ANTHROPIC_API_KEY: ${{ secrets.AGENT_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: "Probe 1: plain workflow step"
        run: uv run python scripts/net_probe.py

      - name: "Probe 2: inside Claude Code's Bash tool"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            Run exactly one command: `uv run python scripts/net_probe.py`
            Then reply with its complete output, verbatim. Do nothing else.
          claude_args: |
            --max-turns 4
            --allowedTools "Bash(uv run:*)"
