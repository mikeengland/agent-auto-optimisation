name: Evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  evals:
    needs: unit
    runs-on: ubuntu-latest
    env:
      AGENT_ANTHROPIC_API_KEY: ${{ secrets.AGENT_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run eval suite
        run: |
          if [ -z "$AGENT_ANTHROPIC_API_KEY" ]; then
            echo "::warning::AGENT_ANTHROPIC_API_KEY secret not set; skipping LLM evals."
            exit 0
          fi
          uv run python -m evals.run --markdown results.md
      - name: Publish results
        if: always()
        run: '[ -f results.md ] && cat results.md >> "$GITHUB_STEP_SUMMARY" || true'
